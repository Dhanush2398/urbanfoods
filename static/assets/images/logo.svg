<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="qbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#ff8c3a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular 'Q' base representing a plate -->
  <circle cx="128" cy="120" r="80" fill="none" stroke="url(#qbGrad)" stroke-width="24" filter="url(#shadow)" />
  
  <!-- The tail of the 'Q' shaped like a delivery fast line / leaf -->
  <path d="M 170 170 C 190 190, 220 200, 220 200 C 220 200, 210 170, 190 150 Z" fill="url(#qbGrad)" filter="url(#shadow)" />

  <!-- A fork in the negative space or inside -->
  <path d="M 112 70 L 112 110 A 16 16 0 0 0 144 110 L 144 70" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" />
  <line x1="128" y1="110" x2="128" y2="160" stroke="#111827" stroke-width="12" stroke-linecap="round" />
  <line x1="128" y1="70" x2="128" y2="90" stroke="#111827" stroke-width="12" stroke-linecap="round" />
</svg>
