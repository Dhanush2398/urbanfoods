<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | UrbanFoods</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .search-page-header {
            background: linear-gradient(135deg, #fff0e5 0%, #ffffff 100%);
            padding: 80px 0 40px;
        }
        .search-large {
            background: var(--qb-white);
            border-radius: var(--qb-radius-pill);
            padding: 5px;
            box-shadow: var(--qb-shadow-md);
            display: flex;
            align-items: center;
            border: 2px solid var(--qb-orange);
            transition: all var(--qb-transition-fast);
        }
        .search-large:focus-within {
            box-shadow: var(--qb-shadow-glow);
        }
        .search-large input {
            border: none;
            background: transparent;
            padding: 15px 25px;
            font-size: 1.2rem;
            flex-grow: 1;
        }
        .search-large input:focus {
            outline: none;
        }
        .popular-search-badge {
            border: 1px solid var(--qb-border);
            color: var(--qb-text-muted);
            padding: 8px 16px;
            border-radius: var(--qb-radius-pill);
            background: var(--qb-white);
            cursor: pointer;
            transition: all var(--qb-transition-fast);
        }
        .popular-search-badge:hover {
            border-color: var(--qb-orange);
            color: var(--qb-orange);
            background: var(--qb-orange-light);
        }
        .suggestion-item {
            padding: 15px;
            border-bottom: 1px solid var(--qb-border);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background var(--qb-transition-fast);
        }
        .suggestion-item:hover {
            background: var(--qb-light-gray);
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- Navbar Minimal -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 fixed-top">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand d-flex align-items-center fw-extrabold text-navy" href="index.html">
                <img src="assets/images/logo.svg" alt="UrbanFoods Logo" width="40" height="40" class="me-2">
                UrbanFoods
            </a>
            <a href="index.html" class="btn btn-light rounded-pill px-3"><i class="fa-solid fa-xmark me-2"></i>Close</a>
        </div>
    </nav>

    <main style="padding-top: 76px;">
        <div class="search-page-header">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8 animate-fade-up">
                        <div class="search-large mb-4">
                            <i class="fa-solid fa-search text-orange fs-4 ms-3"></i>
                            <input type="text" placeholder="Search for restaurants, cuisines, or dishes..." autofocus>
                        </div>
                        
                        <div>
                            <h6 class="fw-bold mb-3 text-navy">Popular Searches</h6>
                            <div class="d-flex flex-wrap gap-2">
                                <span class="popular-search-badge">Idli near me</span>
                                <span class="popular-search-badge">Thali</span>
                                <span class="popular-search-badge">Healthy bowls</span>
                                <span class="popular-search-badge">Udupi Veg Express</span>
                                <span class="popular-search-badge">Vegan options</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 animate-fade-up delay-100">
                    
                    <h5 class="fw-bold mb-4">Recent Searches</h5>
                    
                    <div class="card card-qb border-0 p-0 mb-5">
                        <div class="suggestion-item">
                            <i class="fa-solid fa-clock-rotate-left text-muted me-3"></i>
                            <div class="flex-grow-1">
                                <h6 class="mb-0 fw-semibold">Dosa & Fries Co.</h6>
                                <small class="text-muted">Restaurant</small>
                            </div>
                        </div>
                        <div class="suggestion-item">
                            <i class="fa-solid fa-clock-rotate-left text-muted me-3"></i>
                            <div class="flex-grow-1">
                                <h6 class="mb-0 fw-semibold">Truffle Mushroom Idli</h6>
                                <small class="text-muted">Dish</small>
                            </div>
                        </div>
                    </div>

                    <!-- No Results Mockup (Hidden by default, just showing layout) -->
                    <!--
                    <div class="text-center py-5">
                        <img src="https://cdni.iconscout.com/illustration/premium/thumb/no-search-result-find-2112239-1773708.png" alt="No Results" width="200" class="mb-4 opacity-50" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1601050690597-df0568f70950?q=80&w=400&h=400&fit=crop';">
                        <h4 class="fw-bold text-navy">No results found</h4>
                        <p class="text-muted">Try checking your spelling or using different keywords.</p>
                    </div>
                    -->

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
