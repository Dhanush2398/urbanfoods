<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | UrbanFoods</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        .map-placeholder {
            background-color: #e5e7eb;
            background-image: url('https://instamart-media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,h_600,w_600//InstamartAssets/idli_vada.webp5');
            background-size: cover;
            background-position: center;
            height: 350px;
            position: relative;
        }
        .map-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
        }
        .rider-marker {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: var(--qb-orange);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.4);
            animation: pulse-marker 2s infinite;
        }
        @keyframes pulse-marker {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 107, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
        }
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e5e7eb;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        .timeline-marker {
            position: absolute;
            left: -30px;
            top: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e5e7eb;
            z-index: 1;
        }
        .timeline-item.done .timeline-marker {
            background: var(--qb-orange);
            border-color: var(--qb-orange);
        }
        .timeline-item.active .timeline-marker {
            background: #fff;
            border: 4px solid var(--qb-orange);
        }
        .tracking-card {
            background: var(--qb-white);
            border-radius: var(--qb-radius-xl);
            padding: 40px;
            box-shadow: var(--qb-shadow-lg);
            margin-top: -60px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 transition-normal">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand d-flex align-items-center fw-extrabold text-navy" href="index.html">
                <img src="assets/images/logo.svg" alt="UrbanFoods Logo" width="40" height="40" class="me-2">
                UrbanFoods
            </a>
            <div class="dropdown">
                <button class="btn btn-light rounded-pill px-3 py-2 border d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                    <img src="https://i.pravatar.cc/100?img=11" class="rounded-circle me-2" width="24" height="24">
                    <span class="fw-semibold">Karthik</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pb-5">
        
        <!-- Map Area -->
        <div class="map-placeholder animate-fade-up">
            <div class="map-overlay"></div>
            <div class="rider-marker">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="tracking-card animate-fade-up delay-100">
                        
                        <!-- ETA Header -->
                        <div class="text-center border-bottom pb-4 mb-4">
                            <h2 class="fw-extrabold text-navy mb-1">15 mins</h2>
                            <p class="text-muted mb-0">Estimated Delivery Time (7:45 PM)</p>
                            
                            <!-- Progress Bar -->
                            <div class="progress mt-3" style="height: 8px;">
                                <div class="progress-bar bg-orange progress-bar-striped progress-bar-animated" role="progressbar" style="width: 75%"></div>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Left: Timeline -->
                            <div class="col-md-7 border-end-md">
                                <h5 class="fw-bold mb-4">Order Status</h5>
                                <div class="timeline">
                                    <div class="timeline-item done">
                                        <div class="timeline-marker"></div>
                                        <h6 class="fw-bold mb-1">Order Confirmed</h6>
                                        <small class="text-muted">7:15 PM</small>
                                    </div>
                                    <div class="timeline-item done">
                                        <div class="timeline-marker"></div>
                                        <h6 class="fw-bold mb-1">Preparing Food</h6>
                                        <small class="text-muted">7:20 PM</small>
                                    </div>
                                    <div class="timeline-item active">
                                        <div class="timeline-marker"></div>
                                        <h6 class="fw-bold text-orange mb-1">Out for Delivery</h6>
                                        <small class="text-muted">Rider is on the way</small>
                                    </div>
                                    <div class="timeline-item">
                                        <div class="timeline-marker"></div>
                                        <h6 class="fw-semibold text-muted mb-1">Delivered</h6>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Right: Rider Info -->
                            <div class="col-md-5 mt-4 mt-md-0 ps-md-4">
                                <h5 class="fw-bold mb-4">Your Rider</h5>
                                
                                <div class="d-flex align-items-center mb-4">
                                    <img src="https://i.pravatar.cc/150?img=12" class="rider-profile me-3 border shadow-sm" alt="Rider">
                                    <div>
                                        <h6 class="fw-bold mb-1">Manjunath</h6>
                                        <div class="d-flex align-items-center small text-muted">
                                            <i class="fa-solid fa-star text-warning me-1"></i> 4.9 (120+ deliveries)
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-qb flex-grow-1"><i class="fa-solid fa-phone me-2"></i> Call</button>
                                    <button class="btn btn-primary-qb flex-grow-1"><i class="fa-solid fa-comment-dots me-2"></i> Chat</button>
                                </div>

                                <div class="bg-light p-3 rounded-3 border mt-4">
                                    <p class="small text-muted mb-0"><i class="fa-solid fa-circle-info text-orange me-2"></i> Contactless delivery requested. The rider will leave the package at the door.</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
