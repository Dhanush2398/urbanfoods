{% extends "restaurant/base.html" %}
{% block title %}Total Orders - Urban Foods{% endblock %}
{% block content %}
<div class="content-body">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header border-0 pb-0 d-flex justify-content-between align-items-center flex-wrap">
            <h4 class="card-title">Total Orders History</h4>
          </div>
          <div class="card-body">
            <!-- Include the full table order list -->
            {% include "restaurant/includes/order_list.html" with orders=orders status_filter="all" %}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
